    <path d="M 100 265 C 100 225, 140 210, 200 210 C 260 210, 300 225, 300 265 A 100 28 0 0 0 100 265 Z" fill="#F2F2F2" />

    <use href="#grain" transform="translate(175, 205) rotate(15)" />
