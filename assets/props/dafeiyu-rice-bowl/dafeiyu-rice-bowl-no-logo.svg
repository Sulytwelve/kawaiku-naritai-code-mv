<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDFDFD" />
      <stop offset="50%" stop-color="#F2EFE9" />
      <stop offset="100%" stop-color="#E0DCD3" />
    </linearGradient>

    <radialGradient id="innerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8E8E8" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A67B1E" />
    </linearGradient>

    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" />
    </filter>

    <g id="grain">
      <path d="M0,0 C3,-3 9,-3 12,0 C9,3 3,3 0,0 Z" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5" />
      <path d="M2,-1 C4,-2 7,-2 9,0" fill="none" stroke="#F5F5F5" stroke-width="0.5" />
    </g>
    <g id="grain-dark">
      <path d="M0,0 C3,-3 9,-3 12,0 C9,3 3,3 0,0 Z" fill="#F0F0F0" stroke="#D0D0D0" stroke-width="0.5" />
    </g>
  </defs>

  <ellipse cx="200" cy="368" rx="80" ry="8" fill="rgba(0,0,0,0.08)" filter="url(#blur)" />

  <g>
